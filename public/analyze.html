<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>分析结果 · 英文点读</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%235b52e8'/%3E%3Ctext x='50' y='70' font-size='52' text-anchor='middle' fill='white' font-family='Georgia'%3EAa%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="reader">
  <header class="topbar">
    <a class="btn ghost small" href="/">← 返回编辑</a>
    <span class="top-title">分析结果</span>
    <div class="top-right">
      <span id="stat" class="chip">统计中…</span>
      <button id="shareBtn" class="btn ghost small" type="button">分享 ⤴</button>
      <button id="themeBtn" class="icon-btn theme-toggle" type="button" title="切换主题">🌙</button>
    </div>
  </header>

  <main class="wrap">
    <div id="hint" class="hint">
      <span>✨ 带有<b style="color:var(--word);border-bottom:2px dotted var(--word);font-weight:inherit;">虚线下划线</b>的单词已命中本地词库，点击即可查看讲解卡片；<kbd>Esc</kbd> 可随时关闭。</span>
      <button id="hintClose" class="x" type="button" title="不再提示">✕</button>
    </div>

    <article id="article" class="article"></article>

    <div id="empty" class="empty hidden">
      <div class="big">📝</div>
      <p>还没有要分析的文本</p>
      <a class="btn primary" href="/">去输入</a>
    </div>
  </main>

  <div id="scrim" class="scrim"></div>

  <aside id="drawer" class="drawer" role="dialog" aria-modal="true" aria-hidden="true" aria-label="单词卡片">
    <header class="drawer-head">
      <button id="backBtn" class="icon-btn hidden" type="button" title="返回">←</button>
      <div id="wordTitle" class="head-word">word</div>
      <span id="fileChip" class="chip file">…</span>
      <a id="camLink" class="chip cam" href="https://dictionary.cambridge.org/us/dictionary/english-chinese-simplified/" target="_blank" rel="noopener noreferrer" title="在剑桥词典查看">📘 Cambridge</a>
      <button id="closeBtn" class="icon-btn close" type="button" title="关闭 (Esc)">✕</button>
    </header>
    <div id="drawerBody" class="drawer-body">
      <div id="loading" class="spinner hidden" role="status" aria-label="加载中"></div>
      <div id="mdContent" class="md"></div>
      <div id="mdError" class="md-error hidden"></div>
    </div>
    <footer class="drawer-foot">
      <button id="footClose" class="btn ghost wide" type="button">关闭 <kbd>Esc</kbd></button>
    </footer>
  </aside>

  <div id="shareModal" class="share-modal" aria-hidden="true" role="dialog" aria-label="分享这段分析">
    <div class="share-card">
      <header class="share-head">
        <div class="share-title">分享这段分析</div>
        <button id="shareClose" class="icon-btn close" type="button" title="关闭 (Esc)">✕</button>
      </header>
      <div id="shortRow" class="share-row">
        <label>短链接 · 内容 MD5</label>
        <div class="share-url">
          <input id="shortUrl" type="text" readonly>
          <button id="openShort" class="icon-btn" type="button" title="在新窗口打开">↗</button>
          <button id="copyShort" class="btn primary small" type="button">复制</button>
        </div>
        <p class="share-note">同一段内容永远得到同一个链接；对方通过该地址即可打开同样的分析页（需能访问当前服务的地址，如已部署的域名）</p>
      </div>
      <p id="shareErr" class="share-note hidden" style="color:var(--danger)">⚠️ 分享服务不可用，请确认服务已启动</p>
      <footer class="share-foot">
        <button id="nativeShare" class="btn ghost small hidden" type="button">系统分享…</button>
      </footer>
    </div>
  </div>

  <div id="toast" class="toast" role="status"></div>

  <script src="/theme.js"></script>
  <script src="/md.js"></script>
  <script src="/share-codec.js"></script>
  <script src="/analyze.js"></script>
</body>
</html>
