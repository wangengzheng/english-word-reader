<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>英文点读 · English Reader</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%235b52e8'/%3E%3Ctext x='50' y='70' font-size='52' text-anchor='middle' fill='white' font-family='Georgia'%3EAa%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="home">
  <button class="icon-btn theme-toggle" type="button" title="切换主题">🌙</button>

  <main>
    <header class="hero">
      <div class="logo">Aa</div>
      <h1>英文点读</h1>
      <p class="sub">输入英文句子或文章，命中本地词库的单词会亮起虚线下划线 —— 点击即可展开讲解卡片。</p>
    </header>

    <section class="composer">
      <textarea id="text" spellcheck="false" autofocus
        placeholder="在此粘贴或输入英文，支持多段…&#10;&#10;Hello everyone. Today I want to talk about communication."></textarea>
      <div class="composer-foot">
        <span id="stats" class="muted">0 个单词 · 0 个段落</span>
        <div class="row">
          <button id="example" class="btn ghost small" type="button">✨ 示例</button>
          <button id="clear" class="btn ghost small" type="button">清空</button>
          <button id="go" class="btn primary" type="button" disabled>开始分析 <span class="arrow">→</span></button>
        </div>
      </div>
    </section>

    <p class="hint-line"><kbd>⌘/Ctrl</kbd> + <kbd>Enter</kbd> 快速开始 · 词库：<span id="dictInfo">正在加载词库…</span></p>
  </main>

  <script src="/theme.js"></script>
  <script src="/index.js"></script>
</body>
</html>
